es", "Operating exclusively within one nation", "Avoiding international markets entirely"], "a": 1, "e": "MNCs drive globalization through cross-border production, investment, and integrated global supply chains."}, {"q": "A criticism of MNCs raised by anti-globalization movements is that they:", "o": ["Always improve labor conditions everywhere", "Can exploit weaker regulatory environments and labor in developing countries for profit", "Have no influence over national governments", "Only operate in wealthy countries"], "a": 1, "e": "Critics argue MNCs sometimes exploit lax regulation and cheap labor in developing countries to maximize profit."}, {"q": "International governmental organizations (IGOs) like the UN are formed to:", "o": ["Replace all national governments", "Facilitate cooperation among states on shared issues via treaty-based frameworks", "Eliminate national sovereignty entirely", "Serve only military purposes"], "a": 1, "e": "IGOs provide treaty-based frameworks for states to cooperate on shared political, economic or security issues."}, {"q": "NGOs commonly engage in areas such as:", "o": ["Currency printing", "Human rights advocacy, humanitarian relief, and environmental protection", "National tax collection", "National military command"], "a": 1, "e": "NGOs typically work in areas like human rights, humanitarian aid, development, and environmental protection."}, {"q": "A commonly cited benefit of globalization is:", "o": ["Reduced access to global markets", "Increased access to goods, capital, technology, and ideas across borders", "Total elimination of poverty everywhere instantly", "Complete cultural homogenization with no resistance"], "a": 1, "e": "Globalization is often credited with expanding access to markets, technology, capital and ideas worldwide."}, {"q": "A commonly cited criticism of globalization is that it can:", "o": ["Equally benefit all social classes and countries", "Widen inequality between and within countries (the North-South divide)", "End all forms of international trade", "Strengthen every state's sovereignty equally"], "a": 1, "e": "Critics argue globalization can deepen inequality, benefiting wealthier states/classes disproportionately."}, {"q": "'Glocalization' refers to the process by which:", "o": ["Global trends are adapted to fit local contexts and cultures", "Local cultures are completely erased by global trends", "States become fully isolated from global trends", "Global institutions replace local governments"], "a": 0, "e": "Glocalization describes how global products, ideas or practices are adapted to local cultural contexts."}, {"q": "Regionalism refers to the process by which states in a geographic area:", "o": ["Actively cooperate and integrate on political and/or economic matters", "Completely isolate themselves from neighbors", "Merge into a single global government", "Reject all forms of cooperation"], "a": 0, "e": "Regionalism involves deliberate cooperation and integration among neighboring states."}, {"q": "Regionalization (as distinct from regionalism) refers more to:", "o": ["Formal treaties creating regional organizations", "The organic growth of societal/economic interactions and integration within a geographic area, not necessarily formalized", "Global military alliances", "Only cultural exchange programs"], "a": 1, "e": "Regionalization often refers to informal, society-driven integration, while regionalism refers to deliberate policy-driven cooperation."}, {"q": "The European Union (EU) is commonly cited as the most advanced example of:", "o": ["Global unipolarity", "Deep regional economic and political integration", "Pure economic liberalism with no institutions", "Total state sovereignty loss with no benefits"], "a": 1, "e": "The EU represents one of the deepest forms of regional integration, spanning economic, political and legal cooperation."}, {"q": "The African Union (AU), successor to the OAU, is an example of:", "o": ["A purely economic trade bloc with no political dimension", "A regional intergovernmental organization promoting political and economic cooperation across Africa", "A global superpower alliance", "A private multinational corporation network"], "a": 1, "e": "The AU functions as a regional IGO fostering political and economic cooperation among African states."}, {"q": "One rationale often given for regional integration is that it can:", "o": ["Increase bargaining power and economic scale for smaller/weaker states collectively", "Weaken all member states equally with no benefit", "Eliminate the need for any diplomacy", "Guarantee permanent conflict among members"], "a": 0, "e": "Regional integration can boost collective bargaining power, markets, and security cooperation among member states."}, {"q": "A potential drawback of regional/economic integration is that it can:", "o": ["Require states to cede some degree of national policy autonomy to shared institutions", "Have zero effect on national sovereignty", "Guarantee instant equal benefit to every member", "Prevent any future trade at all"], "a": 0, "e": "Deeper integration often requires member states to accept shared rules/institutions, constraining full policy independence."}, {"q": "Skeptics of globalization often point to the era before WWI as evidence that:", "o": ["Global trade integration is a brand-new 21st-century phenomenon", "Earlier periods also saw significant levels of international trade and capital flows", "No trade existed before 1990", "Globalization began only after the Cold War"], "a": 1, "e": "Skeptics note that pre-WWI trade and capital mobility levels were, in some measures, comparable to more recent decades."}], "explain": [{"q": "Explain the three main perspectives (hyper-globalist, skeptic, transformationalist) on the debate over globalization.", "a": "Hyper-globalists believe a single integrated global economy has emerged that overrides state control. Skeptics argue there is no truly unified global economy, only a world dividing into major regional blocs, with states remaining important. Transformationalists take a middle position, arguing globalization creates a new international order where states adapt their roles but remain central actors."}, {"q": "Explain the economic, political, and socio-cultural dimensions of globalization.", "a": "The economic dimension involves the growing integration of global finance, trade, production and multinational corporate activity. The political dimension concerns how issues like human rights and geopolitics are increasingly addressed at a global rather than purely national level. The socio-cultural dimension refers to social relations and cultural practices becoming delinked from specific territories, producing an emerging \"global culture.\""}, {"q": "Explain the difference between regionalism and regionalization.", "a": "Regionalism refers to the deliberate, often formal, policy-driven process by which states in a geographic area choose to cooperate and integrate — for example through treaties creating regional organizations like the EU or AU. Regionalization refers more broadly to the organic growth of economic and societal interactions and interdependence within a region, which may occur informally, driven by trade, migration, or cultural ties, without necessarily being organized through formal state-led agreements."}, {"q": "Explain the role of multinational corporations (MNCs), IGOs, and NGOs as non-state drivers of globalization.", "a": "MNCs drive economic globalization by organizing production, investment, and trade networks across multiple countries, often headquartered in one state but operating globally. IGOs, formed through treaties among governments, provide institutional frameworks (like the UN or WTO) for states to cooperate on shared global issues. NGOs operate independently of governments to advance goals such as human rights, humanitarian relief, development, and environmental protection, often working across borders and influencing both public opinion and policy at the global level."}, {"q": "Explain the main arguments for and against globalization.", "a": "Proponents argue globalization expands access to markets, capital, technology, and ideas, driving economic growth, innovation, and cultural exchange. Critics argue it can deepen inequality both within and between countries — often summarized as a North-South divide — by allowing wealthier states, corporations, and elites to capture disproportionate benefits, while exposing weaker economies and labor forces to exploitation and instability from volatile global markets."}, {"q": "Explain the concept of 'glocalization' and why it matters for understanding socio-cultural globalization.", "a": "Glocalization describes how global products, media, and cultural practices are adapted, blended, or reinterpreted to fit local cultural contexts rather than simply replacing them wholesale. This matters because it challenges the simplistic view that globalization produces uniform global cultural homogenization; instead, local cultures actively shape and reshape global influences, producing hybrid outcomes specific to each place."}, {"q": "Explain why regional integration, such as through the EU or AU, is pursued by states despite the loss of some national policy autonomy.", "a": "States pursue regional integration because it can increase their collective bargaining power in global trade and diplomacy, expand market access and economic scale beyond what any single (often smaller) state could achieve alone, and enable cooperative responses to shared security, economic, or environmental challenges. While integration requires ceding some national policy autonomy to shared regional institutions, states judge the collective economic and political benefits to outweigh this cost."}]}, {"id": "ch5", "title": "Chapter 5: Major Contemporary Global Issues", "mcq": [{"q": "One of the two main global security challenges highlighted in the chapter, alongside terrorism, is:", "o": ["Currency devaluation", "Nuclear proliferation", "Trade deficits", "Urbanization"], "a": 1, "e": "Terrorism and nuclear proliferation are identified as the two main global security issues of the emerging world order."}, {"q": "Terrorism that occurs within a country's own borders and is linked to extremist groups is called:", "o": ["State terrorism", "Domestic terrorism", "Global terrorism", "Religious terrorism"], "a": 1, "e": "Domestic terrorism happens within a single country's borders, associated with extremist groups there."}, {"q": "Terrorism connected to struggles for political autonomy or independence is classified as:", "o": ["Nationalist terrorism", "Religious terrorism", "State terrorism", "Global terrorism"], "a": 0, "e": "Nationalist terrorism is closely tied to movements seeking political autonomy or independence."}, {"q": "Terrorism carried out or sponsored by a government against its own or other populations is termed:", "o": ["Domestic terrorism", "Nationalist terrorism", "State terrorism", "Religious terrorism"], "a": 2, "e": "State terrorism is described as a calculated, destructive form enabled by the power resources available to governments."}, {"q": "Which is NOT listed among the factors conducive to terrorism?", "o": ["Socio-economic causes", "Political causes", "Psychological causes", "Climatic causes"], "a": 3, "e": "The module lists socio-economic, political and psychological causes of terrorism, not climatic causes."}, {"q": "A key reason for nuclear weapons proliferation during the Cold War was:", "o": ["Global trade liberalization", "Super-power rivalry between the US and USSR", "Expansion of the WTO", "Growth of NGOs"], "a": 1, "e": "Superpower rivalry during the Cold War is listed as a major driver of nuclear proliferation."}, {"q": "Global environmental issues discussed in the chapter prominently include:", "o": ["Climate change and global warming", "Currency exchange rates", "WTO trade rounds", "Diplomatic protocol"], "a": 0, "e": "Climate change and global warming are highlighted as central global environmental issues."}, {"q": "Migration and refugee problems are categorized under which type of global issue?", "o": ["Global security issues", "Global socio-economic issues", "Global environmental issues", "Global cultural issues"], "a": 1, "e": "Migration and refugee problems fall under global socio-economic issues in the chapter's classification."}, {"q": "Clashes over identity and civilization are discussed under which category of global issues?", "o": ["Global cultural issues", "Global security issues", "Global environmental issues", "Global economic issues"], "a": 0, "e": "Cultural (civilizational) clashes and identity conflicts are treated as global cultural issues."}, {"q": "The 21st-century shift described in the chapter is characterized as a move from:", "o": ["Regionalism to nationalism", "International relations to broader global relations and issues", "Bipolarity to unipolarity only", "Diplomacy to warfare"], "a": 1, "e": "The chapter frames a shift in focus from state-centered international relations toward broader global relations and issues driven by interdependence and globalization."}, {"q": "The chapter frames 'contemporary global issues' primarily as problems that:", "o": ["Can be solved entirely by one state acting alone", "Cross national borders and require cooperative, often global, responses", "Only affect wealthy countries", "Are purely historical and no longer relevant"], "a": 1, "e": "Contemporary global issues are transnational in nature, requiring cooperation beyond what any single state can achieve alone."}, {"q": "Terrorism is generally defined in the module as the use of violence primarily aimed at:", "o": ["Achieving direct military victory over an enemy army", "Creating fear/terror to achieve political, ideological, or religious objectives", "Personal financial gain only", "Formal declarations of war"], "a": 1, "e": "Terrorism is defined by its use of violence/fear to pursue political, ideological or religious goals rather than direct military conquest."}, {"q": "Religious terrorism is primarily driven by:", "o": ["Extreme, fundamentalist interpretations of religious doctrine used to justify violence", "Purely economic grievances", "National boundary disputes only", "Trade policy disagreements"], "a": 0, "e": "Religious terrorism stems from extremist religious ideology used to justify violent action."}, {"q": "Global terrorism, as distinguished from domestic terrorism, is characterized by:", "o": ["Activity confined strictly to one country", "Networks and operations enabled to span multiple countries, often aided by globalization", "No use of modern technology", "Exclusively state-sponsored activity"], "a": 1, "e": "Global terrorism leverages globalization (travel, communication, finance) to operate across national borders."}, {"q": "Among the causes of terrorism, 'psychological causes' generally refer to factors such as:", "o": ["Trade imbalances", "Individual radicalization, alienation, or a sense of grievance/identity crisis", "Currency exchange rates", "International legal disputes only"], "a": 1, "e": "Psychological causes involve individual-level factors like alienation, grievance or identity-based radicalization."}, {"q": "'Socio-economic causes' of terrorism commonly cited in the module include:", "o": ["Poverty, unemployment, and social marginalization", "Excess wealth and overemployment", "Purely religious doctrine", "Weather patterns"], "a": 0, "e": "Poverty, unemployment and marginalization are cited as socio-economic drivers that can fuel extremism."}, {"q": "'Political causes' of terrorism often cited include:", "o": ["Political repression, denial of political rights, or unresolved conflicts", "Excess political freedom with no grievances", "Trade surpluses", "Currency stability"], "a": 0, "e": "Political repression and unresolved political grievances are commonly cited drivers of terrorism."} inate from and affect multiple countries simultaneously, making them a genuinely transnational security concern."}, {"q": "Pandemics and global health crises are treated as global issues mainly because they:", "o": ["Are contained naturally within one country's borders", "Can spread rapidly across borders, requiring coordinated international health responses", "Have no economic implications", "Are unrelated to global governance"], "a": 1, "e": "Pandemics can spread across borders quickly, requiring cross-border coordination such as through the WHO."}, {"q": "Weapons of mass destruction (WMDs) as a category generally include:", "o": ["Nuclear, chemical, and biological weapons", "Only conventional firearms", "Economic sanctions", "Trade tariffs"], "a": 0, "e": "WMDs typically refer to nuclear, chemical, and biological weapons capable of mass casualties."}, {"q": "Deterrence theory, relevant to the nuclear proliferation discussion, argues that possessing nuclear weapons can:", "o": ["Guarantee war between rival states", "Discourage attack by threatening devastating retaliation", "Have no strategic effect at all", "Only be relevant to economic policy"], "a": 1, "e": "Deterrence theory holds that the threat of retaliatory nuclear devastation discourages adversaries from attacking."}], "explain": [{"q": "Explain the different types of terrorism identified in the module (domestic, nationalist, religious, state, global).", "a": "Domestic terrorism occurs within one country's borders via extremist groups; nationalist terrorism is tied to independence/autonomy struggles; religious terrorism stems from extreme fundamentalist religious groups; state terrorism is carried out using a government's own power resources; and global terrorism is enabled by globalization, allowing terrorist activity and networks to operate across borders."}, {"q": "Explain why global environmental and socio-economic issues (such as climate change and migration) are treated as major contemporary global dual's psychological vulnerability to extremist recruitment."}, {"q": "Explain the purpose of the Nuclear Non-Proliferation Treaty (NPT) and the ongoing security challenge of proliferation to non-state actors.", "a": "The NPT aims to prevent the spread of nuclear weapons to additional states, promote the peaceful use of nuclear energy under international safeguards, and commit existing nuclear powers to eventual disarmament. A major contemporary concern is the risk of nuclear materials or technology reaching non-state actors such as terrorist groups, since traditional deterrence theory — which relies on the threat of retaliation against a state — does not effectively apply to non-state actors who may lack a fixed territory or population to retaliate against."}, {"q": "Explain why climate change and environmental degradation are treated as major global security and socio-economic issues rather than purely local environmental concerns.", "a": "Climate change and environmental degradation are treated as major global issues because their effects — such as rising temperatures, extreme weather, and resource scarcity — cross national borders regardless of where the underlying emissions or degradation originate, and they can drive migration, resource conflicts, and economic instability that affect multiple countries simultaneously, requiring coordinated international responses (such as global climate agreements) rather than isolated domestic policy."}, {"q": "Explain the connection between environmental degradation, migration, and conflict as discussed in the chapter.", "a": "Environmental degradation and resource scarcity — such as droughts, land degradation, or water shortages — can undermine livelihoods and food security, pushing affected populations to migrate in search of better conditions elsewhere. This migration, combined with competition over increasingly scarce resources, can generate social and political tension, both within receiving countries and between states ies. These flows also require cooperation among countries of origin, transit, and destination, along with international bodies like UNHCR, illustrating how no single state can manage such crises alone and underscoring the need for coordinated global governance responses."}]}], "finalExamMcq": [{"q": "All are actors of international relations EXCEPT:", "o": ["Non-governmental organization", "Individual", "State", "Multinational Corporation"], "a": null, "note": "No single correct option is defined in the source exam for this item (it hinges on \"None\" as a possible answer) — treat as a discussion question: which of the four listed is arguably NOT a recognized IR actor?", "special": true}, {"q": "Which theory of international relations has an OPTIMISTIC (not pessimistic) attitude toward international relations?", "o": ["Realism", "Structuralism", "Idealism", "Marxism"], "a": 2, "e": "Idealism/Liberalism is comparatively optimistic about cooperation, unlike the more pessimistic realism and structuralism."}, {"q": "Which statement best describes foreign policy?", "o": ["Decisions and actions that concern relations between one state and others", "Rules and procedures that guide other states' relations", "The expression of national interest vis-à-vis other states", "All of the above"], "a": 3, "e": "All three descriptions are valid facets of what foreign policy is."}, {"q": "Which is NOT within the scope of contemporary study of international relations?", "o": ["Increasing interconnectedness of like-minded people worldwide", "Terrorism", "State and human security", "Personal shopping habits"], "a": 3, "e": "Personal shopping habits are not a subject of contemporary IR study, unlike security, terrorism and interconnectedness."}, {"q": "The foundational assumption of realist theory relies on:", "o": ["Cooperative actions of individuals", "Conflict behavior of states", "Class antagonism", "Cooperative nature of corporations"], "a": 1, "e": "Realism's foundation rests on the const tabs = [
  ...DATA.chapters.map(c => ({id:c.id, label:c.title.split(':')[0]})),
  {id:'final', label:'Final Exam'}
];

let current = tabs[0].id;

function renderTabs(){
  const nav = document.getElementById('tabs');
  nav.innerHTML='';
  tabs.forEach(t=>{
    const b=document.createElement('button');
    b.textContent=t.label;
    b.className = t.id===current ? 'active':'';
    b.onclick=()=>{ current=t.id; render(); };
    nav.appendChild(b);
  });
}

function mcqCard(item, idx, prefix){
  const card = document.createElement('div');
  card.className='qcard';
  const numEl = document.createElement('div');
  numEl.className='qnum';
  numEl.textContent = 'Question ' + (idx+1);
  card.appendChild(numEl);
  const qEl = document.createElement('div');
  qEl.className='qtext';
  qEl.textContent = item.q;
  card.appendChild(qEl);

  if(item.special){
    const note = document.createElement('div');
    note.className='notebox';
    note.textContent = item.note;
    card.appendChild(note);
  }

  const opts = document.createElement('div');
  opts.className='opts';
  const exBox = document.createElement('div');
  exBox.className='explainbox';
  exBox.textContent = item.e || '';

  item.o.forEach((optText, oi)=>{
    const btn = document.createElement('button');
    btn.className='opt';
    btn.textContent = String.fromCharCode(65+oi) + '. ' + optText;
    btn.onclick = ()=>{
      const allBtns = opts.querySelectorAll('.opt');
      allBtns.forEach(b=>b.disabled = true);
      if(item.a === null || item.a === undefined){
        btn.classList.add('correct');
      } else if(oi === item.a){
        btn.classList.add('correct');
      } else {
        btn.classList.add('incorrect');
        const correctBtn = allBtns[item.a];
        if(correctBtn) correctBtn.classList.add('correct');
      }
      exBox.classList.add('show');
    };
    opts.appendChild(btn);
  });

  card.appendChild(opts);
  card.appendChild(exBox);
  return card;
}

function explainCard(item, idx){
  const card = document.createElement('div');
  card.className='qcard';
  const numEl = document.createElement('div');
  numEl.className='qnum';
  numEl.textContent = 'Explain ' + (idx+1);
  card.appendChild(numEl);
  const qEl = document.createElement('div');
  qEl.className='qtext';
  qEl.textContent = item.q;
  card.appendChild(qEl);
  const btn = document.createElement('button');
  btn.className='revealbtn';
  btn.textContent='Reveal model answer';
  const ansBox = document.createElement('div');
  ansBox.className='answerbox';
  ansBox.textContent = item.a;
  btn.onclick=()=>{ ansBox.classList.toggle('show'); };
  card.appendChild(btn);
  card.appendChild(ansBox);
  return card;
}

function render(){
  renderTabs();
  const main = document.getElementById('main');
  main.innerHTML='';

  if(current === 'final'){
    const t1 = document.createElement('div');
    t1.className='section-title';
    t1.textContent='Multiple Choice — Final Exam Practice';
    main.appendChild(t1);
    DATA.finalExamMcq.forEach((item, i)=> main.appendChild(mcqCard(item, i)));

    const t2 = document.createElement('div');
    t2.className='section-title';
    t2.textContent='Explain / Writing Questions';
    main.appendChild(t2);
    DATA.finalExamExplain.forEach((item,i)=> main.appendChild(explainCard(item, i)));
    return;
  }

  const chapter = DATA.chapters.find(c=>c.id===current);
  const h = document.createElement('div');
  h.className='section-title';
  h.style.marginTop='6px';
  h.textContent = chapter.title;
  main.appendChild(h);

  const t1 = document.createElement('div');
  t1.className='section-title';
  t1.textContent='Multiple Choice';
  main.appendChild(t1);
  chapter.mcq.forEach((item,i)=> main.appendChild(mcqCard(item, i)));

  const t2 = document.createElement('div');
  t2.className='section-title';
  t2.textContent='Explain Questions';
  main.appendChild(t2);
  chapter.explain.forEach((item,i)=> main.appendChild(explainCard(item, i)));
}

render();
</script>
