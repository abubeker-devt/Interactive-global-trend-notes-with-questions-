<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Global Trends — Interactive Study Notes</title>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1c1b19; --sub:#5c5a54;
  --accent:#8a5a2b; --accent2:#3b6e5e; --border:#e4e0d8;
  --good:#1e7a3d; --good-bg:#e5f5e8; --bad:#b3261e; --bad-bg:#fbe7e5;
  --chip:#efe9dd;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171512; --card:#211f1b; --ink:#f1ede4; --sub:#b7b0a2;
    --accent:#d59a5d; --accent2:#7fc4ad; --border:#3a362e;
    --good:#7fd996; --good-bg:#153323; --bad:#ff9b93; --bad-bg:#3a1a18;
    --chip:#2c2921;
  }
}
:root[data-theme="dark"]{
  --bg:#171512; --card:#211f1b; --ink:#f1ede4; --sub:#b7b0a2;
  --accent:#d59a5d; --accent2:#7fc4ad; --border:#3a362e;
  --good:#7fd996; --good-bg:#153323; --bad:#ff9b93; --bad-bg:#3a1a18;
  --chip:#2c2921;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:Georgia,'Times New Roman',serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
}
header{
  padding:28px 18px 14px; text-align:center;
  border-bottom:1px solid var(--border);
}
header h1{margin:0 0 6px; font-size:1.5rem; letter-spacing:.3px;}
header p{margin:0; color:var(--sub); font-size:.92rem; font-family:Arial,sans-serif;}
nav{
  display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
  padding:14px 12px; max-width:900px; margin:0 auto; font-family:Arial,sans-serif;
}
nav button{
  border:1px solid var(--border); background:var(--card); color:var(--ink);
  padding:8px 14px; border-radius:20px; font-size:.82rem; cursor:pointer;
  font-family:inherit;
}
nav button.active{background:var(--accent); color:#fff; border-color:var(--accent);}
main{max-width:760px; margin:0 auto; padding:0 14px 40px;}
.section-title{
  font-size:1.15rem; margin:22px 0 12px; color:var(--accent2);
  font-family:Arial,sans-serif; font-weight:700;
}
.qcard{
  background:var(--card); border:1px solid var(--border); border-radius:12px;
  padding:16px 16px 14px; margin-bottom:14px;
}
.qnum{font-family:Arial,sans-serif; font-size:.72rem; color:var(--sub); letter-spacing:.06em; text-transform:uppercase;}
.qtext{font-size:1.02rem; line-height:1.45; margin:6px 0 12px;}
.opts{display:flex; flex-direction:column; gap:8px;}
.opt{
  text-align:left; border:1px solid var(--border); background:var(--bg);
  color:var(--ink); padding:10px 12px; border-radius:9px; cursor:pointer;
  font-family:Arial,sans-serif; font-size:.9rem; line-height:1.35;
}
.opt:active{opacity:.85;}
.opt.correct{background:var(--good-bg); border-color:var(--good); color:var(--good); font-weight:700;}
.opt.incorrect{background:var(--bad-bg); border-color:var(--bad); color:var(--bad); font-weight:700;}
.opt[disabled]{cursor:default;}
.explainbox{
  margin-top:10px; font-family:Arial,sans-serif; font-size:.86rem;
  background:var(--chip); border-radius:8px; padding:10px 12px; display:none; line-height:1.4;
}
.explainbox.show{display:block;}
.revealbtn{
  font-family:Arial,sans-serif; font-size:.82rem; border:1px solid var(--accent);
  color:var(--accent); background:transparent; padding:7px 14px; border-radius:8px; cursor:pointer;
}
.answerbox{
  margin-top:10px; font-family:Arial,sans-serif; font-size:.9rem; line-height:1.5;
  background:var(--good-bg); color:var(--good); border-radius:8px; padding:10px 12px; display:none;
}
.answerbox.show{display:block;}
.notebox{
  font-family:Arial,sans-serif; font-size:.86rem; color:var(--sub); margin-top:10px;
}
.hidden{display:none;}
.score{
  font-family:Arial,sans-serif; text-align:center; color:var(--sub); font-size:.85rem; margin:10px 0 4px;
}
footer{text-align:center; font-family:Arial,sans-serif; font-size:.75rem; color:var(--sub); padding:20px;}
</style>
</head>

<script>
const DATA = {"chapters": [{"id": "ch1", "title": "Chapter 1: International Relations", "mcq": [{"q": "Nationalism is best described as a doctrine that:", "o": ["Rejects the idea of the nation-state", "Asserts the nation as the basic political unit organizing society", "Focuses only on economic classes", "Promotes rule by international organizations"], "a": 1, "e": "Heywood (2014) defines nationalism as the doctrine that the nation is the basic unit of political organization."}, {"q": "Which is NOT one of the three main claims of nationalist doctrine?", "o": ["Nations are distinct and unique", "Loyalty to the nation outweighs other interests", "The nation should have its own state", "Nations should merge into a single world government"], "a": 3, "e": "The three claims are distinctiveness, primacy of loyalty, and the demand for a nation-state — not world government."}, {"q": "An example often cited as a near-\"pure\" nation-state is:", "o": ["Ethiopia", "Iceland", "India", "Nigeria"], "a": 1, "e": "Iceland is cited as culturally homogenous with a well-documented shared descent, close to a pure nation-state."}, {"q": "The Treaty of Westphalia (1648) is significant in IR history mainly because it:", "o": ["Created the United Nations", "Ended Papal religious authority and enabled state sovereignty in Europe", "Started the Cold War", "Established the WTO"], "a": 1, "e": "Westphalia transferred religious authority from the Church to monarchs and enabled sovereign statehood."}, {"q": "Multinational Corporations (MNCs) are classified in IR as:", "o": ["State actors", "Non-state actors", "International courts", "Regional blocs"], "a": 1, "e": "MNCs are non-state (transnational) actors that operate across many countries."}, {"q": "A level of analysis that focuses on lobbying groups and collective decision-making units is the:", "o": ["Individual level", "Group level", "State level", "System level"], "a": 1, "e": "Group-level analysis studies how groups (e.g., lobbies) shape decisions, distinct from individual leaders."}, {"q": "In a unipolar international system:", "o": ["Two states share dominant power", "Numerous states compete for dominance", "One state holds the greatest overall power", "No state has any power"], "a": 2, "e": "Unipolarity means a single dominant state, as with the US after 1945."}, {"q": "Anarchy in international relations refers to:", "o": ["Total chaos and violence everywhere", "The absence of a shared authority able to enforce common rules among states", "A form of government", "The end of diplomacy"], "a": 1, "e": "Anarchy denotes the lack of an overarching authority above sovereign states, not literal chaos."}, {"q": "Which theory views the international system as constituted by shared ideas and intersubjective understanding rather than material forces alone?", "o": ["Realism", "Liberalism", "Constructivism", "Mercantilism"], "a": 2, "e": "Constructivism argues the international system is a human, ideational construct, not something existing independently like the solar system."}, {"q": "Realist theory bases its analysis of the international system chiefly on:", "o": ["Cooperative behavior of individuals", "Conflictual/self-interested behavior of states seeking security and power", "Class antagonism", "Shared liberal values"], "a": 1, "e": "Realism sees states as self-interested actors primarily concerned with power and survival."}, {"q": "External sovereignty refers to a state's:", "o": ["Control over its own economy only", "Ultimate authority within its territory", "Recognition and standing within the international community", "Military alliance system"], "a": 2, "e": "Sovereignty has two sides: internal (authority within territory) and external (standing among other states)."}, {"q": "According to Marx's analysis, the central unit of analysis in international relations is:", "o": ["The sovereign state", "Class antagonism between the bourgeoisie and proletariat", "Individual leaders", "Cultural identity"], "a": 1, "e": "Marxist analysis centers on the conflict between economic classes rather than the state as such."}, {"q": "Which scholar defined nationalism as \"a principle which holds that the political and national unit should be congruent\"?", "o": ["Michael Hechter", "Ernest Gellner", "John Breuilly", "Andrew Heywood"], "a": 1, "e": "Ernest Gellner's definition ties nationalism to the congruence of political and national units."}, {"q": "According to Michael Hechter, nationalism is, above all:", "o": ["Economic", "Political", "Religious", "Cultural"], "a": 1, "e": "Hechter described nationalism as, above all, political."}, {"q": "In Spencer & Wollman's definition, nationalism ultimately seeks:", "o": ["Class equality", "Political power in the name of the national community, ideally as a state", "Religious unity", "Free trade"], "a": 1, "e": "Their definition frames nationalism as seeking political power for the nation, ideally as its own state."}, {"q": "According to Heywood, nations are best understood as:", "o": ["Purely legal-administrative units created by treaty", "Historical entities that evolve organically out of ethnic communities", "Temporary military alliances", "International organizations"], "a": 1, "e": "Heywood describes nations as historical entities evolving organically from ethnic communities, revealed in myths and legends."}, {"q": "In everyday language, which three terms are often used interchangeably though they differ conceptually in IR?", "o": ["Power, diplomacy, anarchy", "Nation, state, country", "Realism, liberalism, Marxism", "Alliance, neutrality, non-alignment"], "a": 1, "e": "'Nation', 'state' and 'country' are commonly conflated in everyday speech but are distinct concepts in IR."}, {"q": "The term \"international relations\" was first used by which scholar, in 1798?", "o": ["Hans Morgenthau", "Jeremy Bentham", "Ernest Gellner", "Hedley Bull"], "a": 1, "e": "J. Bentham is credited with the first use of the term 'international relations' in 1798."}, {"q": "Before becoming a distinct discipline, the study of IR was largely seen as a branch of:", "o": ["Law, philosophy, or history", "Physics and mathematics", "Business administration", "Medicine"], "a": 0, "e": "Early IR study was largely treated as part of law, philosophy or history."}, {"q": "What primarily prevented the rise of centralized governmental authority in Medieval Europe?", "o": ["Strong monarchies", "Small, largely unconnected feudal fiefdoms", "A single dominant religion", "Advanced trade networks"], "a": 1, "e": "Fragmented, unconnected feudal fiefdoms hindered centralized authority before the modern state system emerged."}, {"q": "The Peace of Westphalia followed a period of European conflict rooted mainly in disputes over:", "o": ["Trade tariffs", "Religious authority between the Church and monarchs", "Colonial boundaries in Africa", "Naval supremacy"], "a": 1, "e": "Westphalia resolved conflicts tied to Papal religious authority over European states."}, {"q": "The modern discipline of IR is closely linked to the reaction to the horrors of which event?", "o": ["The French Revolution", "World War I", "The Napoleonic Wars", "The Cold War"], "a": 1, "e": "IR emerged largely as a scholarly response to the devastation and diplomatic failures associated with WWI."}, {"q": "Traditionally, International Relations as a field focused primarily on interactions between:", "o": ["Individuals", "Corporations", "States", "Religious institutions"], "a": 2, "e": "IR traditionally centered on state-to-state interactions before broadening to include other actors."}, {"q": "Intergovernmental organizations (IGOs) are defined by having members that are:", "o": ["Private corporations", "National governments", "Individual citizens", "Religious leaders"], "a": 1, "e": "IGOs are organizations whose members are national governments, formed through treaties."}, {"q": "Which of the following is an example of a non-state (transnational) actor in IR?", "o": ["A national government", "An intergovernmental organization", "A sovereign state's military", "A head of state"], "a": 1, "e": "IGOs, NGOs, and MNCs are all classified as non-state/transnational actors."}, {"q": "Analyzing the actions of a Prime Minister personally negotiating an agreement reflects which level of analysis?", "o": ["Individual level", "Group level", "State level", "System level"], "a": 0, "e": "Individual-level analysis focuses on specific leaders/individuals and their decisions."}, {"q": "State-level analysis is often described as reflecting the discipline's relative:", "o": ["Individualism", "State-centrism", "Anarchism", "Globalism"], "a": 1, "e": "State-level analysis reflects IR's traditional state-centrism, treating the state as the main reference point."}, {"q": "System-level analysis is particularly concerned with:", "o": ["The personal beliefs of individual diplomats", "The distribution of power amongst states (polarity)", "Domestic lobbying groups", "Corporate mergers"], "a": 1, "e": "System-level analysis emphasizes how power is distributed among states — unipolarity, bipolarity, multipolarity."}, {"q": "Issues such as the global economy, transnational terrorism, and the internet are best analyzed at the:", "o": ["Individual level", "Group level", "State level", "System level"], "a": 3, "e": "These issues go beyond any single state's control and are studied through system-level analysis."}, {"q": "From 1945–1949, the international system is described as:", "o": ["Bipolar, led by the USA and USSR", "Unipolar, led by the United States", "Multipolar, with several competing great powers", "Anarchical, with no dominant power"], "a": 1, "e": "The immediate post-WWII period (1945-1949) is described as US unipolarity before Soviet power fully emerged."}, {"q": "From 1949–1989, the international system is characterized as:", "o": ["Unipolar (USA)", "Bipolar (USA and USSR)", "Multipolar", "Non-polar"], "a": 1, "e": "This period reflects Cold War bipolarity between the USA and USSR."}, {"q": "Concentration of power is generally described as being greatest in which system?", "o": ["Multipolar system", "Bipolar system", "Unipolar system", "Anarchical system"], "a": 2, "e": "Power is most concentrated in a unipolar system, where one state dominates."}, {"q": "Power in international politics is often compared to:", "o": ["Language in linguistics", "Money in economics", "Time in physics", "Oxygen in biology"], "a": 1, "e": "The module notes: 'As money is for economics, power is for international relations.'"}, {"q": "Sovereignty involves a double claim by states relating to:", "o": ["Internal authority and external recognition", "Military strength and economic wealth", "Cultural identity and language", "Religious authority and legal codes"], "a": 0, "e": "Sovereignty combines internal (authority within territory) and external (standing in the international community) claims."}, {"q": "Liberalism/Idealism in IR was historically also referred to as a:", "o": ["Realist theory", "Utopian theory", "Structuralist theory", "Constructivist theory"], "a": 1, "e": "Liberalism in IR was originally labeled a 'utopian' theory by critics such as E.H. Carr."}, {"q": "Liberal/Idealist theorists emphasize creating a peaceful world chiefly through:", "o": ["Military deterrence alone", "Integration of states, NGOs, and IGOs", "Isolationism", "Class struggle"], "a": 1, "e": "Liberalism focuses on cooperative integration among states and international/non-governmental organizations."}, {"q": "\"Enlargement\" as a liberal policy prescription refers to:", "o": ["Expanding military budgets", "Encouraging the spread of democracies", "Expanding territorial borders", "Increasing tariffs"], "a": 1, "e": "Enlargement in liberal thought means promoting the spread of democratic states, linked to democratic peace theory."}, {"q": "The liberal democratic peace theory suggests that:", "o": ["Democracies rarely go to war with one another", "All states are equally prone to war", "Only autocracies can maintain peace", "Trade always causes war"], "a": 0, "e": "Democratic peace theory holds that democracies tend not to fight each other."}, {"q": "Realism holds that states should base foreign policy chiefly on:", "o": ["Cultural and moral considerations", "Maximizing power relative to others", "International law above all else", "Humanitarian ideals"], "a": 1, "e": "Realist policy prescriptions call for focusing on relative power, largely setting aside culture and morality."}, {"q": "A common critique of realism is that it:", "o": ["Overestimates the role of international institutions and norms", "Underestimates the role of international institutions and norms in shaping state behavior", "Focuses too much on non-state actors", "Ignores the state entirely"], "a": 1, "e": "Critics argue realism understates how institutions and norms can shape cooperative state behavior."}, {"q": "Structuralism/Marxism divides capitalist society into which two contradictory classes?", "o": ["Landlords and peasants", "The bourgeoisie and the proletariat", "Elites and masses", "Rulers and clergy"], "a": 1, "e": "Marxist structuralism centers on conflict between the capitalist owning class (bourgeoisie) and workers (proletariat)."}, {"q": "Structuralists broadly divide into which two major camps?", "o": ["Realists and liberals", "Marxist theorists and dependencia theorists", "Idealists and constructivists", "Nationalists and internationalists"], "a": 1, "e": "Structuralism includes Marxist theorists and dependencia (neo-Marxist/economic radical) theorists."}, {"q": "In Marx's theory of historical progression, which stage follows capitalism?", "o": ["Feudalism", "Socialism", "Basic communism", "Mercantilism"], "a": 1, "e": "Marx's stages generally run feudalism → capitalism → socialism → communism."}, {"q": "Dependencia (dependency) theory is sometimes also referred to as:", "o": ["Neo-Marxist/Economic Radical theory", "Neo-liberal theory", "Neo-realist theory", "Post-structuralist theory"], "a": 0, "e": "Dependencia theory is described as a Neo-Marxist and Economic Radical strand of thought."}, {"q": "Constructivism holds that the international system exists primarily as:", "o": ["A fixed material structure like the solar system", "An intersubjective, ideational construct among people", "A product of pure military calculation", "An unchangeable legal order"], "a": 1, "e": "Constructivists see the international system as constituted by shared ideas and intersubjective awareness, not material forces alone."}, {"q": "Critical theories in IR primarily emerged in response to:", "o": ["Constructivism and structuralism", "Mainstream liberalism and realism", "Marxist economics", "Environmental studies"], "a": 1, "e": "Critical theories arose to challenge and go beyond the dominance of mainstream liberal and realist approaches."}, {"q": "A key contribution of critical theories to IR is that they:", "o": ["Reinforce state-centrism", "Give voice to positions and actors typically overlooked by mainstream IR", "Focus solely on military power", "Reject the study of ideas entirely"], "a": 1, "e": "Critical theories highlight perspectives and actors marginalized by mainstream liberal/realist IR scholarship."}, {"q": "A group-level analysis of foreign policy would most likely examine:", "o": ["A single president's personal psychology", "The influence of lobbying groups on national decision-making", "The global distribution of power", "A state's constitution"], "a": 1, "e": "Group-level analysis studies how organized groups, like lobbies, shape policy outcomes."}, {"q": "Which best distinguishes a \"nation\" from a \"state\" in IR terminology?", "o": ["A nation is a legal-political entity with defined borders; a state is a cultural/historical community", "A nation is a cultural/historical community; a state is a legal-political entity with sovereignty over territory", "They are entirely identical concepts", "A nation always has more territory than a state"], "a": 1, "e": "A nation refers to a people bound by shared culture/history, while a state is the sovereign political-legal entity governing a territory."}, {"q": "An interconnected feature of today's world, cited as crucial to understanding IR, is:", "o": ["Total isolation of states", "Geographic and other forms of global interconnectedness", "The disappearance of borders entirely", "Uniform global culture"], "a": 1, "e": "The module stresses growing global interconnectedness as a defining feature of contemporary international life."}], "explain": [{"q": "Explain the difference between state-level and system-level analysis in international relations.", "a": "State-level analysis treats the state as the main unit/actor, examining its behavior, interests and decision-makers. System-level analysis instead looks at the overall structure (e.g., polarity, distribution of power) within which all states interact, including forces beyond any single state's control, such as the global economy or transnational terrorism."}, {"q": "Explain why the state is considered central to the discipline of international relations (\"state-centrism\").", "a": "States are treated as the primary and most consequential actors because they hold sovereignty, control territory, populations and resources, and are the principal members of major international organizations like the UN, making them the main framework through which international interactions are organized and analyzed."}, {"q": "Explain the realist view on why states pursue power.", "a": "Realists argue the international system is anarchic, with no higher authority to guarantee state security. In this self-help environment, states must maximize their own power and military/economic capability to ensure survival, since they cannot rely on other actors or institutions to protect them."}, {"q": "Explain the difference between a 'nation' and a 'nation-state', using the concept of a near-pure nation-state as an example.", "a": "A nation is a culturally and historically defined community bound by shared identity, myths and language, while a nation-state is a sovereign political entity whose population largely coincides with that single national community. Iceland is cited as close to a pure nation-state because its population shares such well-documented common descent that almost the entire citizenry belongs to one nation within one state's borders."}, {"q": "Explain the three levels of analysis — individual, group, and state — and give an example of each.", "a": "Individual-level analysis studies specific leaders' decisions and personalities, e.g., a president negotiating a treaty. Group-level analysis studies how organized collectives such as lobbying groups shape policy outcomes. State-level analysis treats the state itself as the primary actor, examining its officials, institutions and interests as a whole, reflecting IR's traditional state-centrism."}, {"q": "Explain the difference between unipolar, bipolar, and multipolar international systems, with historical examples.", "a": "A unipolar system has one dominant state controlling the greatest share of power, as with the US from 1945–1949. A bipolar system has two roughly equal dominant powers, as with the US and USSR during 1949–1989. A multipolar system has several competing great powers with no single or dual dominant actor, reflecting a more diffuse concentration of power."}, {"q": "Explain how liberalism and realism differ in their view of human nature and cooperation in international relations.", "a": "Liberalism/idealism views humans and states as capable of cooperation, holding that shared values, institutions and interdependence can produce a peaceful, integrated world. Realism instead views states as primarily self-interested actors operating in an anarchic system, where security concerns and competition for power make conflict a persistent possibility, requiring states to prioritize power over moral or cooperative considerations."}, {"q": "Explain the Marxist/structuralist perspective on international relations and how it differs from realism.", "a": "Marxist/structuralist theory argues that the economic structure of society — specifically the conflict between the capitalist bourgeoisie and the working-class proletariat — determines political relations, including international ones. This differs from realism, which centers analysis on sovereign states competing for power in an anarchic system, rather than on class-based economic conflict as the primary driver of world politics."}, {"q": "Explain constructivism's core claim about the nature of the international system.", "a": "Constructivism holds that the international system is not an objective, fixed material structure like the solar system; instead, it exists only through the shared ideas, norms and intersubjective understandings held by people and states. Because the system is a human, ideational construct, it can change as those shared beliefs and norms change, unlike realism's view of an unchanging anarchic structure."}, {"q": "Explain the significance of the Peace of Westphalia (1648) for the modern state system.", "a": "The Peace of Westphalia ended the Church's hierarchical religious authority over European rulers, transferring the authority to determine religious matters to individual monarchs. This enabled European states to achieve sovereignty over their own territories, institutionalized diplomatic practice, and laid the foundation for the modern system of sovereign, territorially defined states that underlies contemporary international relations."}, {"q": "Explain why the horrors of World War I are considered central to the founding of international relations as an academic discipline.", "a": "The massive human cost of WWI was widely linked to the failures of the old international order, including secret diplomacy, alliance systems and the absence of mechanisms to prevent conflict. This reaction spurred scholars and policymakers to systematically study the causes of war and conditions for peace, giving rise to IR as a distinct academic discipline focused on preventing future large-scale conflict."}, {"q": "Explain the three main types of actors in international relations: state actors, intergovernmental organizations, and non-governmental organizations.", "a": "State actors are sovereign governments, the traditional core unit of IR, each pursuing their own national interests. Intergovernmental organizations (IGOs) are bodies formed by treaties or agreements among national governments, ranging from small groupings to near-universal bodies like the UN. Non-governmental organizations (NGOs) are private, independent-of-government bodies pursuing goals such as social services, development, or environmental protection, operating alongside but separately from states and IGOs."}, {"q": "Explain the concept of anarchy in international relations and clarify a common misunderstanding about the term.", "a": "In IR, anarchy does not mean literal chaos or lawlessness; rather, it refers to the absence of a shared overarching authority or government above sovereign states with the right to enforce common rules. States exist in this decentralized system without a world government, which shapes how they pursue security and cooperation, even though order, law and cooperation can still exist among them."}, {"q": "Explain the critique that realism underestimates non-state actors and international institutions.", "a": "Critics argue realism's focus on states as unitary, power-maximizing actors overlooks the real influence of international institutions, legal norms, and non-state actors such as IGOs, NGOs and multinational corporations in shaping state behavior and enabling cooperation. This critique suggests realism offers an incomplete picture of a world where actors beyond the state increasingly affect outcomes in areas like trade, human rights and the environment."}, {"q": "Explain what critical theories contribute to the study of international relations that mainstream liberalism and realism do not.", "a": "Critical theories challenge the assumptions embedded in mainstream liberal and realist approaches, questioning whose interests are served by dominant IR narratives. They give voice to marginalized perspectives and actors often overlooked in state-centric, power-focused analysis, broadening IR to include questions of identity, emancipation and structural inequality that traditional theories tend not to address."}]}, {"id": "ch2", "title": "Chapter 2: Foreign Policy and Diplomacy", "mcq": [{"q": "The minimum essential components of a state's national interest include all EXCEPT:", "o": ["Security", "National development", "World order", "Entertainment"], "a": 3, "e": "The module lists security, national development and world order as the essential components of national interest."}, {"q": "Foreign policy objectives most related to self-preservation of political/territorial integrity are called:", "o": ["Long-range objectives", "Middle-range objectives", "Core values/short-range objectives", "Universal objectives"], "a": 2, "e": "Core interests and values (short-range objectives) are tied to self-preservation of the state."}, {"q": "Economic uplift, raised living standards, and prestige-building fall under which category of foreign policy objectives?", "o": ["Short-range/core objectives", "Middle-range objectives", "Long-range objectives", "Diplomatic objectives"], "a": 1, "e": "Middle-range objectives include economic development, prestige and expansion goals."}, {"q": "A state adopting a foreign policy pattern in which it revises its own policy to favor a dominant power's global restructuring is practicing:", "o": ["Self-extension", "Self-abnegation", "Self-preservation", "Isolationism"], "a": 1, "e": "Self-abnegating behavior means yielding one's own preferences in favor of another actor's leadership/agenda."}, {"q": "Diplomacy is best defined as:", "o": ["The use of military force to settle disputes", "A peaceful process of dialogue between actors pursuing their objectives", "Unilateral economic sanctions", "A treaty-signing ceremony only"], "a": 1, "e": "Diplomacy involves private and public dialogue between actors (often state representatives) to pursue objectives peacefully."}, {"q": "An economic instrument that restricts the QUANTITY of a good that may be exported or imported is called a:", "o": ["Tariff", "Quota", "Embargo", "Loan"], "a": 1, "e": "A quota limits the quantity of a traded commodity, unlike a tariff (a tax) or an embargo (a full ban)."}, {"q": "A complete ban on trade with a country is known as a(n):", "o": ["Tariff", "Quota", "Embargo", "Subsidy"], "a": 2, "e": "An embargo is a prohibition on commerce with a specified country."}, {"q": "The Wuchale Treaty controversy during Menelik II's reign centered on:", "o": ["A border dispute with Sudan", "Article 17's conflicting Amharic/Italian versions implying a protectorate", "A trade agreement with Britain", "The founding of the League of Nations"], "a": 1, "e": "Italy's version of Article 17 implied Ethiopia accepted an Italian protectorate, which Ethiopia rejected, leading to conflict."}, {"q": "Ethiopia joined the League of Nations during the reign of:", "o": ["Tewodros II", "Yohannes IV", "Menelik II", "Haile Selassie I"], "a": 3, "e": "Haile Selassie I secured Ethiopia's membership in the League of Nations to bolster diplomatic security."}, {"q": "The Dergue regime's foreign policy was primarily oriented toward:", "o": ["Western liberal capitalism", "Socialist ideology and alliance with the Eastern bloc", "Strict isolationism", "Pan-Arab unity"], "a": 1, "e": "The military government (1974-1991) aligned with socialist states, receiving support from Cuba and the Soviet Union."}, {"q": "Ethiopia's post-1991 foreign policy strategy that prioritizes domestic issues first is known as the:", "o": ["Outside-in approach", "Inside-out approach", "Non-alignment approach", "Balance-of-power approach"], "a": 1, "e": "The inside-out approach focuses first on domestic economic development as the basis for foreign relations."}, {"q": "Which is a rule of effective diplomacy mentioned in the module?", "o": ["Ignore the other side's position", "Leave avenues of retreat open", "Make all statements public immediately", "Refuse compromise"], "a": 1, "e": "Leaving room for retreat/compromise is listed as a rule of effective diplomacy, alongside patience and seeking common ground."}, {"q": "K. Holsti defines national interest as:", "o": ["A fixed legal document", "An image of the future state of affairs and future set of values a state wants", "A treaty between two states", "A military doctrine"], "a": 1, "e": "Holsti frames national interest as an image of the future conditions and values a state seeks to realize."}, {"q": "National interest is best described as the basis for:", "o": ["The judicial system", "The contents/goals of foreign policy", "Domestic tax policy", "Sports diplomacy"], "a": 1, "e": "National interest is the main driving force shaping the goals and content of a state's foreign policy."}, {"q": "A state that 'acts in a bold and sweeping' style, per the operational philosophy criterion, contrasts with a state that:", "o": ["Acts cautiously and incrementally", "Never engages in foreign policy", "Always follows ideology", "Relies only on military force"], "a": 0, "e": "Operational philosophy contrasts a bold/sweeping style with a more cautious, step-by-step approach to policy."}, {"q": "Using ideology (e.g., communism vs. capitalism) to identify friends or enemies is an example of which criterion for determining national interest?", "o": ["Pragmatic criteria", "Ideological criteria", "Moral and legal criteria", "Partisan criteria"], "a": 1, "e": "Ideological criteria involve classifying other states as friend or foe based on shared or opposing ideology."}, {"q": "Keeping treaty promises and abiding by international law reflects which criterion for national interest?", "o": ["Pragmatic criteria", "Foreign dependency criteria", "Moral and legal criteria", "Professional advancement criteria"], "a": 2, "e": "Moral and legal criteria emphasize honoring commitments and following international law."}, {"q": "A decision-maker who evaluates foreign policy purely on cost-benefit grounds, without emotion, is applying:", "o": ["Ideological criteria", "Pragmatic criteria", "Partisan criteria", "Foreign dependency criteria"], "a": 1, "e": "Pragmatic criteria rely on low-key, matter-of-fact cost-benefit analysis rather than emotion or morality."}, {"q": "When policy choices are shaped by concern for one's own career survival within government, this reflects:", "o": ["Professional advancement criteria", "Moral and legal criteria", "Foreign dependency criteria", "Ideological criteria"], "a": 0, "e": "Professional advancement criteria involve adjusting action based on personal/career survival and growth."}, {"q": "Equating the interests of one's political party or ethnic/religious group with the national interest reflects:", "o": ["Pragmatic criteria", "Partisan criteria", "Moral and legal criteria", "Operational philosophy"], "a": 1, "e": "Partisan criteria involve conflating a party, army, or organization's interest with the whole nation's interest."}, {"q": "Foreign dependency criteria in determining national interest typically apply to:", "o": ["Major world powers", "Less-developed, formerly colonized states still reliant on ex-colonial powers", "Neutral states only", "States with no foreign relations"], "a": 1, "e": "This criterion applies especially to less-developed countries still dependent on former colonial powers for aid and technology."}, {"q": "Foreign policy is defined as the set of objectives and instruments a state adopts to:", "o": ["Regulate its domestic economy only", "Guide its relations with the outside world", "Draft its constitution", "Select its head of state"], "a": 1, "e": "Foreign policy concerns objectives and tools for managing relations with other states/the outside world."}, {"q": "According to Arnold Wolfers, foreign policy behavior ultimately boils down to a limited set of:", "o": ["Economic outcomes", "Possible goals/postures a state can pursue", "Legal doctrines", "Cultural exchanges"], "a": 1, "e": "Wolfers argued foreign policy behavior reduces to a small set of basic possible goals or postures."}, {"q": "Which is one of the three crucial dimensions along which foreign policy behavior is classified?", "o": ["Alignment", "Currency policy", "Judicial review", "Religious affiliation"], "a": 0, "e": "The three dimensions are alignment, scope and interest, and modus operandi (method of operation)."}, {"q": "A state choosing not to formally ally with any bloc, but also not committing to neutrality doctrine, may be practicing:", "o": ["Alliance", "Non-alignment", "Isolationism only", "Embargo"], "a": 1, "e": "Non-alignment is one of the three alignment patterns, alongside alliances and neutrality."}, {"q": "A country that limits how far it engages internationally, staying largely inward-focused, is exhibiting:", "o": ["Alliance behavior", "A policy of isolationism (limited scope and interest)", "Foreign aid diplomacy", "Economic dependency"], "a": 1, "e": "The 'scope and interest' dimension covers how far a state engages internationally, including isolationist tendencies."}, {"q": "Which of these is listed as a rule of effective diplomacy?", "o": ["Be unrealistic about goals", "Seek common ground with the other side", "Reveal all strategy immediately", "Avoid understanding the other side's position"], "a": 1, "e": "Seeking common ground is one of the listed rules of effective diplomacy, along with patience and realism."}, {"q": "Providing concessional funds to another state to support development is an example of which economic instrument of foreign policy?", "o": ["Tariff", "Loans/credits", "Quota", "Boycott"], "a": 1, "e": "Loans and credits are listed as economic instruments states use to influence other states' behavior or support them."}, {"q": "Providing weapons or training to another state's armed forces is an example of:", "o": ["Military aid", "Foreign aid", "Tariff policy", "Quota policy"], "a": 0, "e": "Military aid is a distinct economic/foreign-policy instrument from general foreign aid."}, {"q": "Emperor Tewodros II sought recognition and modernization assistance chiefly from which powers?", "o": ["Britain, France, and Russia", "China and Japan", "The Ottoman Empire", "The United States"], "a": 0, "e": "Tewodros II appealed to Britain, France and Russia as Christian nations for support against regional threats."}, {"q": "Yohannes IV signed the Hewett Treaty (1884) with which parties?", "o": ["The Anglo-Egyptians", "The Italians", "The French", "The Americans"], "a": 0, "e": "The Hewett Treaty (1884) was concluded with the Anglo-Egyptians during Yohannes IV's reign."}, {"q": "Yohannes IV, like his predecessor, viewed which force as a major threat to Ethiopia's territorial integrity?", "o": ["Communism", "Islam (via Egyptian invasion attempts)", "Italian colonialism alone", "British trade policy"], "a": 1, "e": "Yohannes IV, following Tewodros II, saw Egyptian-backed threats linked to Islam as a serious security concern."}, {"q": "Menelik II pursued a 'double track diplomacy' in response to whose expansion?", "o": ["Britain's", "France's", "Italy's", "Sudan's"], "a": 2, "e": "Menelik II used double-track diplomacy to try to contain or reverse Italian expansion from Eritrea toward Ethiopia."}, {"q": "One of Ethiopia's key objectives for joining the League of Nations under Haile Selassie I was to:", "o": ["Secure legal and diplomatic protection for the state", "Abolish the monarchy", "Ally with Italy", "End all foreign trade"], "a": 0, "e": "League of Nations membership was sought to bolster Ethiopia's diplomatic security and international standing."}, {"q": "After WWII, Haile Selassie's government sought to reduce the dominance of which power in the Horn of Africa?", "o": ["The United States", "Britain", "Italy", "France"], "a": 1, "e": "The Emperor aimed to reduce British dominance in Ethiopia and the wider Horn of Africa region after independence."}, {"q": "One of the reasons Emperor Haile Selassie favored the USA over Britain post-WWII was that the USA:", "o": ["Was a colonial power in Africa", "Could provide technical and military assistance since it emerged strong from WWII", "Refused all foreign engagement", "Had no interest in Ethiopia"], "a": 1, "e": "The US, less weakened by WWII than European powers, could offer more substantial technical/military assistance."}, {"q": "According to Professor Ayele Nugussie, one of the Imperial Regime's foreign policy principles was:", "o": ["Permanent war with neighbors", "Peaceful resolution of international disputes", "Total isolation from world affairs", "Alliance exclusively with communist states"], "a": 1, "e": "A key stated principle was that international disputes should be resolved peacefully where there is good will."}, {"q": "The Organization of African Unity (OAU) was established on the soil of which country, linked partly to its diplomatic and neutrality position?", "o": ["Kenya", "Ethiopia", "Nigeria", "Egypt"], "a": 1, "e": "The OAU was founded in Addis Ababa, Ethiopia, reflecting Ethiopia's diplomatic standing at the time."}, {"q": "Ethiopia's active involvement after 1955 in the Non-Alignment Movement reflected continuation of its support for:", "o": ["Colonial powers", "Cold War bloc politics on one side only", "An independent, non-aligned diplomatic stance", "Isolationist policy"], "a": 2, "e": "Ethiopia's Non-Alignment Movement involvement extended its tradition of an independent diplomatic posture."}, {"q": "The Dergue regime received military support from which country's troops during the Somali conflict?", "o": ["Cuban troops", "French troops", "British troops", "Chinese troops"], "a": 0, "e": "Cuban troops fought against Somali aggression, backed by Soviet-supplied weapons, during the Dergue era."}, {"q": "Which of the following was cited as a reason for the failure of the Dergue's foreign policy?", "o": ["Excessive reliance on the free market", "Its use of force against domestic opposition alienated the population", "Too much cooperation with Western Europe", "Overuse of diplomacy over military force"], "a": 1, "e": "Cracking down forcefully on opposition groups damaged the regime's standing and contributed to its foreign policy failure."}, {"q": "Post-1991 Ethiopian foreign policy is primarily driven by the pursuit of:", "o": ["Regional military dominance", "National interest and security, including survival of the multi-national state", "Total isolation from neighbors", "Return to monarchy"], "a": 1, "e": "Post-1991 policy centers on securing national interest, security, and preserving the multinational state."}, {"q": "Economic diplomacy in post-1991 Ethiopian foreign policy primarily involves:", "o": ["Attracting foreign investment, seeking export markets, and securing aid/loans", "Banning all foreign trade", "Nationalizing all industries", "Rejecting international assistance"], "a": 0, "e": "Economic diplomacy focuses on investment attraction, market access for exports, and securing concessional loans/aid."}, {"q": "Across Ethiopia's imperial, Dergue, and post-1991 regimes, a shared foreign policy priority has been:", "o": ["Alliance with a single fixed global power", "Maintaining territorial integrity and independence", "Abolishing diplomacy", "Total economic self-isolation"], "a": 1, "e": "Despite differing strategies, all three regimes prioritized maintaining Ethiopia's territorial integrity and independence."}, {"q": "Long-range foreign policy objectives typically involve:", "o": ["Immediate territorial defense only", "Visions/dreams about the ultimate ideological or political organization of the international system", "Routine embassy administration", "Daily trade transactions"], "a": 1, "e": "Long-range objectives concern broad visions for the future shape of the international order, often making universal demands."}, {"q": "A state's foreign policy objective aimed at gaining new territory or spreading influence is generally classified as a:", "o": ["Short-range/core objective", "Middle-range objective (expansion)", "Diplomatic-only objective", "Neutral objective"], "a": 1, "e": "Middle-range objectives include both economic and expansionist goals (territorial or ideological)."}], "explain": [{"q": "Explain the relationship between foreign policy and diplomacy.", "a": "Foreign policy sets the objectives, priorities and instruments a state uses to guide its relations with other states, while diplomacy is one of the chief instruments/methods used to pursue those objectives peacefully, through negotiation and dialogue between representatives of states."}, {"q": "List and briefly explain the short-range (core) and middle-range objectives of a state's foreign policy.", "a": "Short-range/core objectives concern self-preservation of the state's political and territorial integrity — survival itself. Middle-range objectives include economic uplift of the population, raising living standards, enhancing national prestige and status, and territorial or ideological expansion."}, {"q": "Explain why Ethiopia's Imperial regime under Haile Selassie sought closer ties with the United States rather than Britain after WWII.", "a": "Britain was seen as dominating the Horn of Africa and a threat to Ethiopian sovereignty, whereas the US, having emerged strong from WWII while European powers were exhausted, could provide technical and military assistance without the same colonial baggage, making it a more attractive partner."}, {"q": "Explain the ideological, moral/legal, and pragmatic criteria used to determine a state's national interest, and how they differ.", "a": "Ideological criteria classify other states as friend or foe based on shared or opposing political ideology (e.g., capitalism vs. communism). Moral and legal criteria emphasize honoring treaty commitments and abiding by international law and ethical conduct. Pragmatic criteria set aside ideology and morality in favor of a cold, matter-of-fact cost-benefit analysis of what serves the state's practical interests."}, {"q": "Explain the three dimensions along which foreign policy behavior is classified: alignment, scope and interest, and modus operandi.", "a": "Alignment refers to a state's tendency to ally with others, remain neutral, or stay non-aligned, which can shift with circumstances. Scope and interest describes how broadly a state engages internationally versus pursuing an inward-looking, isolationist policy. Modus operandi (method of operation) refers to the characteristic behaviors and patterns — such as preferred tools and strategies — a state uses to pursue its foreign policy goals."}, {"q": "Explain the difference between tariffs, quotas, embargoes, and foreign/military aid as economic instruments of foreign policy.", "a": "A tariff is a tax imposed on traded goods, typically imports. A quota limits the quantity of a good that can be traded. An embargo is a full ban on trade with a given country. Foreign aid provides financial or material assistance to support another state's development or needs, while military aid specifically provides weapons, equipment or training to another state's armed forces — all serving as tools to influence relations and advance foreign policy goals."}, {"q": "Explain how Ethiopia's foreign policy under Emperor Haile Selassie I balanced relations with Britain and the United States.", "a": "Haile Selassie sought to reduce British dominance in the Horn of Africa after independence, since Britain had significant regional influence he saw as a constraint on Ethiopian sovereignty. At the same time, he valued British help in the fight against Italian occupation. Ultimately, he leaned toward the United States for technical and military assistance in the post-war period, since the US emerged from WWII stronger and less encumbered by colonial interests in the region than European powers."}, {"q": "Explain the main foreign policy orientation of the Dergue military government (1974-1991) and why it ultimately failed to win broad international support.", "a": "The Dergue adopted a foreign policy oriented toward socialist ideology, aligning with the Eastern bloc, the Soviet Union, and Cuba, while prioritizing regime survival and territorial integrity. Its foreign policy struggled internationally partly because its harsh crackdown on domestic opposition alienated segments of the population and damaged its international image, and its relations with Western Europe remained poor, limiting the diplomatic support it could draw on."}, {"q": "Explain Ethiopia's post-1991 'inside-out' foreign policy approach.", "a": "The inside-out approach prioritizes addressing domestic issues — particularly economic development and building a democratic system — as the foundation for foreign policy, on the reasoning that a stable, developing domestic base creates a more favorable position from which to engage the outside world, including through economic diplomacy aimed at attracting investment and securing markets and aid."}, {"q": "Explain the difference between core (short-range), middle-range, and long-range foreign policy objectives.", "a": "Core/short-range objectives concern the state's self-preservation — protecting political independence and territorial integrity. Middle-range objectives include economic development, raising living standards, and expanding prestige, status, or territory/ideology. Long-range objectives are broader visions or dreams about the ultimate political or ideological shape of the international system, which can carry universal, far-reaching implications since they extend beyond a single state's immediate interests."}, {"q": "Explain why Menelik II's diplomacy with Italy failed, leading to conflict.", "a": "Menelik II pursued double-track diplomacy to try to contain Italian expansion from its base in Eritrea while preserving Ethiopia's territorial integrity. However, this diplomatic effort broke down over the Wuchale Treaty, whose Italian-language version implied Ethiopia had accepted an Italian protectorate (Article 17), a claim Ethiopia rejected. This disagreement over the treaty's meaning led to the treaty's abrogation and ultimately open conflict."}, {"q": "Explain the concept of national interest and its relationship to foreign policy.", "a": "National interest refers to the values, goals and objectives a state seeks to achieve in its international relations, encompassing security, national development, and world order. It serves as the underlying basis for foreign policy — the specific goals, strategies and instruments a state adopts are meant to preserve and advance its national interest peacefully and rationally."}, {"q": "Explain what is meant by 'partisan criteria' and 'foreign dependency criteria' in determining national interest, and why the latter is especially relevant to less-developed countries.", "a": "Partisan criteria occur when decision-makers equate the interests of their own political party, ethnic group, or institution (such as the military) with the interests of the whole nation, potentially skewing policy. Foreign dependency criteria apply especially to less-developed, formerly colonized countries that remain reliant on their former colonial powers for technical assistance, expertise, and technology even after achieving political independence, which can constrain how freely they can pursue an independent national interest."}]}, {"id": "ch3", "title": "Chapter 3: International Political Economy (IPE)", "mcq": [{"q": "International Political Economy (IPE) primarily examines the interdependence between:", "o": ["Culture and religion", "Politics and economics in the international system", "Law and diplomacy", "Military and technology"], "a": 1, "e": "IPE studies how political and economic realities interact as two sides of the same coin in the global system."}, {"q": "Which theoretical perspective is founded on the ideas of Friedrich List and emphasizes strong state control over trade and investment?", "o": ["Liberalism", "Marxism", "Mercantilism/Nationalism", "Constructivism"], "a": 2, "e": "Mercantilism (economic nationalism), associated with List, favors state-directed economic policy to build national power."}, {"q": "The East Asian economies (Japan, South Korea, Taiwan, China) are often cited as examples of which approach?", "o": ["Pure free-market liberalism", "Developmental state approach", "Marxist central planning", "Dependencia model"], "a": 1, "e": "These economies used strong state guidance of industrial development, termed the developmental state approach, a mercantilist variant."}, {"q": "Economic liberalism in IPE is most closely associated with the ideas of:", "o": ["Karl Marx", "David Ricardo", "Friedrich List", "Adam Smith only"], "a": 1, "e": "Liberalism's free-trade foundation draws heavily on David Ricardo's theory of comparative advantage."}, {"q": "Dependency (dependencia) theory argues that:", "o": ["Free trade benefits all nations equally", "Developed countries exploit less-developed countries through indirect control", "States should isolate themselves economically", "The WTO eliminates global inequality"], "a": 1, "e": "Dependencia theory holds that economically developed states maintain their advantage by indirectly controlling less-developed economies."}, {"q": "The World Trade Organization (WTO), established in 1995, succeeded which earlier arrangement?", "o": ["The World Bank", "The IMF", "The General Agreement on Tariffs and Trade (GATT)", "The League of Nations"], "a": 2, "e": "The WTO replaced GATT (1947) as the body setting rules for global trade."}, {"q": "Which international institution acts as a \"lender of last resort\" and works to prevent balance-of-payments crises?", "o": ["World Bank", "International Monetary Fund (IMF)", "WTO", "United Nations"], "a": 1, "e": "The IMF's core roles include being a lender of last resort and maintaining exchange-rate/payments stability."}, {"q": "The World Bank's mission expanded from post-war European reconstruction to primarily focus on:", "o": ["Military security", "Poverty elimination and infrastructure development in poor countries", "Currency speculation", "Trade tariff enforcement"], "a": 1, "e": "The World Bank now emphasizes poverty reduction, infrastructure and governance capacity in developing countries."}, {"q": "In a floating exchange-rate system, a currency's value is determined by:", "o": ["Government fiat alone", "Money supply and money demand in the market", "A fixed peg to gold", "International treaty"], "a": 1, "e": "Under floating rates, currency value is set by market forces of supply and demand rather than a fixed peg."}, {"q": "The German system of political economy is often described as:", "o": ["Pure market-oriented capitalism", "Welfare state/social market capitalism", "Command socialism", "Mercantilist isolationism"], "a": 1, "e": "Germany balances market efficiency with strong social welfare provisions, termed welfare state capitalism."}, {"q": "The American system of political economy prioritizes:", "o": ["State control of major industries", "Consumer benefit and wealth maximization, with distribution secondary", "Equal distribution of wealth as the top goal", "Collective ownership of production"], "a": 1, "e": "The American model emphasizes maximizing wealth creation for consumers, treating equitable distribution as secondary."}, {"q": "Hegemonic Stability Theory (HST) is most closely associated with which perspective?", "o": ["Liberalism", "Mercantilism", "Constructivism", "Structuralism only"], "a": 1, "e": "HST is a hybrid theory whose closest association is with mercantilism, though it borrows from liberalism and Marxism too."}, {"q": "International Political Economy (IPE) is often described as concerned with the interplay between:", "o": ["The state and the market", "Religion and law", "Culture and language", "Geography and climate"], "a": 0, "e": "IPE centrally studies the tension and interaction between political authority (the state) and economic forces (the market)."}, {"q": "Susan Strange, an influential IPE scholar, emphasized studying:", "o": ["Only military alliances", "Structural power in finance, security, production, and knowledge", "Religious diplomacy", "Ancient trade routes only"], "a": 1, "e": "Susan Strange highlighted structural power across finance, security, production and knowledge as central to IPE."}, {"q": "Mercantilism, as an economic philosophy, historically aimed to:", "o": ["Maximize exports and accumulate wealth/gold for the state", "Eliminate all state involvement in trade", "Promote free immigration", "Abolish tariffs entirely"], "a": 0, "e": "Classical mercantilism sought to build state wealth and power by maximizing exports and accumulating precious metals."}, {"q": "Under mercantilism/economic nationalism, the primary actor directing economic activity is the:", "o": ["Individual consumer", "Multinational corporation", "State", "International organization"], "a": 2, "e": "Mercantilism centers on the state as the key actor directing and protecting national economic activity."}, {"q": "David Ricardo's theory of comparative advantage argues that:", "o": ["Countries should be self-sufficient and avoid trade", "Countries benefit by specializing in and trading goods they produce relatively most efficiently", "Only large countries benefit from trade", "Trade always harms developing countries"], "a": 1, "e": "Comparative advantage shows mutual gains from trade when countries specialize according to relative efficiency."}, {"q": "Liberal IPE theorists generally view government intervention in markets as:", "o": ["Always necessary and beneficial", "Something that should be minimized to allow market efficiency", "Irrelevant to economic outcomes", "The only legitimate form of economic activity"], "a": 1, "e": "Liberalism favors minimal state interference, trusting market mechanisms to allocate resources efficiently."}, {"q": "Structuralist/Marxist IPE theorists view the global capitalist economy as fundamentally:", "o": ["Harmonious and mutually beneficial for all states", "Exploitative, benefiting core/wealthy states and classes at the expense of others", "Irrelevant to international relations", "Controlled entirely by international law"], "a": 1, "e": "Structuralists see global capitalism as structured to benefit dominant states/classes over peripheral ones."}, {"q": "Immanuel Wallerstein's World-Systems Theory divides the global economy into core, periphery, and:", "o": ["Semi-periphery", "Outer-periphery", "Trans-periphery", "Neo-periphery"], "a": 0, "e": "Wallerstein's model includes core, semi-periphery, and periphery zones with unequal economic relationships."}, {"q": "In World-Systems Theory, 'core' countries are typically characterized by:", "o": ["Raw material extraction only", "Advanced industry, capital-intensive production, and higher wages", "Total economic isolation", "No participation in global trade"], "a": 1, "e": "Core countries dominate with advanced, capital-intensive production and generally higher living standards."}, {"q": "'Periphery' countries in World-Systems Theory are typically characterized by:", "o": ["Advanced technology exports", "Reliance on raw material/low-wage labor exports and dependency on core economies", "Total self-sufficiency", "Dominance over global finance"], "a": 1, "e": "Periphery states tend to supply raw materials/cheap labor and remain economically dependent on core states."}, {"q": "The Bretton Woods Conference (1944) established the institutional foundations for which two organizations?", "o": ["The UN and WTO", "The IMF and World Bank", "NATO and the EU", "The League of Nations and ICJ"], "a": 1, "e": "Bretton Woods (1944) created the IMF and the International Bank for Reconstruction and Development (World Bank)."}, {"q": "The original Bretton Woods system pegged currencies to:", "o": ["The US dollar, itself convertible to gold", "The British pound only", "A basket of European currencies", "Bitcoin"], "a": 0, "e": "Under Bretton Woods, currencies were pegged to the US dollar, which was in turn convertible to gold."}, {"q": "The Bretton Woods fixed exchange-rate system effectively ended in:", "o": ["1944", "The early 1970s, when the US suspended dollar-gold convertibility", "2008", "1995"], "a": 1, "e": "The system collapsed in the early 1970s after the US ended the dollar's convertibility into gold (the 'Nixon Shock')."}, {"q": "GATT (1947), the predecessor to the WTO, primarily aimed to:", "o": ["Set global interest rates", "Reduce tariffs and other trade barriers among member states", "Manage international currency reserves", "Provide development loans"], "a": 1, "e": "GATT focused on progressively lowering tariffs and trade barriers through negotiating 'rounds'."}, {"q": "WTO decisions and trade rounds are notable for requiring:", "o": ["Unanimous consent-based negotiation among all member states", "A single dominant state's approval only", "No negotiation process at all", "Approval solely by the IMF"], "a": 0, "e": "WTO negotiations proceed through consensus-based rounds among its many member states."}, {"q": "The World Bank primarily provides member countries with:", "o": ["Short-term balance-of-payments loans", "Long-term loans and grants for development projects and poverty reduction", "Military assistance", "Currency printing services"], "a": 1, "e": "Unlike the IMF's short-term stabilization role, the World Bank focuses on long-term development financing."}, {"q": "IMF loans to member countries facing financial crises typically come with:", "o": ["No conditions at all", "Attached policy conditions (conditionality), such as economic reforms", "Guaranteed forgiveness after one year", "Automatic EU membership"], "a": 1, "e": "IMF assistance is usually conditional on the borrowing country adopting specified economic policy reforms."}, {"q": "A fixed exchange-rate system means a currency's value is:", "o": ["Set by pure market supply and demand", "Pegged by government policy to another currency or a basket of currencies", "Determined solely by inflation", "Irrelevant to trade"], "a": 1, "e": "In a fixed-rate system, the government actively pegs and defends the currency's value against another benchmark."}, {"q": "Hegemonic Stability Theory (HST) proposes that global economic order and openness are best sustained when:", "o": ["No state holds significant power", "Multiple equal powers compete constantly", "A single dominant (hegemonic) power is willing and able to provide/enforce the rules of the system", "All states pursue pure isolationism"], "a": 2, "e": "HST argues a dominant hegemon underwrites and stabilizes the rules of the open international economic system."}, {"q": "Under Hegemonic Stability Theory, the United States after World War II is commonly cited as the hegemon that helped establish:", "o": ["The gold standard's collapse only", "The post-war liberal economic order (Bretton Woods institutions, GATT/WTO)", "The Cold War alliance system exclusively", "Colonial empires"], "a": 1, "e": "The US, as post-war hegemon, played a central role in building institutions like the IMF, World Bank and GATT."}, {"q": "The 'developmental state' model, seen in countries like South Korea and Japan, combines:", "o": ["Pure free-market non-intervention with no industrial policy", "Active state guidance of industrial and economic development within a broadly market-based economy", "Total state ownership of all industry", "Complete economic isolation from world markets"], "a": 1, "e": "The developmental state actively directs industrial policy while still operating largely through market mechanisms."}, {"q": "Foreign Direct Investment (FDI) generally refers to:", "o": ["Buying foreign government bonds only", "Cross-border investment where an investor gains lasting control/interest in a foreign business", "Currency speculation", "Tariff collection"], "a": 1, "e": "FDI involves an investor gaining a significant, lasting stake or control in a business located in another country."}, {"q": "Which of the following is a common criticism directed at structural adjustment programs (SAPs) tied to IMF/World Bank lending?", "o": ["They are always fully successful with no side effects", "They can impose austerity measures that worsen poverty and social hardship in borrowing countries", "They eliminate the need for foreign aid entirely", "They guarantee rapid industrialization"], "a": 1, "e": "SAPs have been criticized for austerity conditions (cuts to public spending, subsidies) that can deepen social hardship."}, {"q": "Economic interdependence among states is generally understood as a situation where:", "o": ["States have no economic ties to one another", "States' economies are mutually reliant, so changes in one affect the others", "Only one state controls global trade", "States compete without any mutual economic effects"], "a": 1, "e": "Interdependence means states' economies are linked such that economic developments in one can significantly affect others."}], "explain": [{"q": "Explain the three major theoretical perspectives of International Political Economy.", "a": "Mercantilism/Nationalism sees the state as the central actor and favors state control over trade and investment to build national power. Liberalism favors free markets, free trade and minimal state interference, based on comparative advantage. Marxism/Structuralism views the global economy as shaped by class conflict and exploitation, with wealthy states/classes benefiting at the expense of poorer ones."}, {"q": "Explain the core function of the IMF and how it differs from the World Bank.", "a": "The IMF focuses on monetary stability — acting as lender of last resort, maintaining stable exchange rates, and preventing balance-of-payments crises, often through conditional lending. The World Bank instead focuses on long-term development financing — funding infrastructure, poverty reduction and governance capacity in developing countries."}, {"q": "Explain the developmental state approach and give an example of where it has been applied.", "a": "The developmental state approach is a variant of mercantilism in which the state actively intervenes to guide and accelerate structural economic transformation rather than leaving development purely to market forces. Japan, South Korea, Taiwan and China are commonly cited examples of economies built on this approach."}, {"q": "Explain Immanuel Wallerstein's World-Systems Theory and its three-tier structure.", "a": "World-Systems Theory divides the global capitalist economy into three tiers: the core (industrially advanced, capital-intensive, wealthy states that dominate the system), the periphery (states that supply raw materials and cheap labor and remain economically dependent), and the semi-periphery (states positioned between the two, exhibiting features of both). The theory argues this structure perpetuates unequal exchange, benefiting the core at the expense of the periphery."}, {"q": "Explain the Bretton Woods system and why it eventually collapsed.", "a": "Established in 1944, the Bretton Woods system created the IMF and World Bank and pegged member currencies to the US dollar, which was itself convertible to gold at a fixed rate, providing global monetary stability after WWII. The system broke down in the early 1970s when the United States, facing growing gold outflows and economic pressures, suspended the dollar's convertibility to gold, forcing major currencies to shift to floating exchange rates."}, {"q": "Explain Hegemonic Stability Theory (HST) and give a historical example of its application.", "a": "HST argues that an open, stable international economic order is most likely to be sustained when a single dominant (hegemonic) power has both the capability and willingness to establish, underwrite, and enforce the system's rules — for example, by providing a reserve currency, ensuring open markets, and acting as lender of last resort. The United States after World War II is the classic example, using its economic and military dominance to help build institutions like the IMF, World Bank, and GATT/WTO that structured the post-war liberal economic order."}, {"q": "Explain the difference between fixed and floating exchange-rate systems, and the trade-offs each involves.", "a": "In a fixed exchange-rate system, a government pegs its currency's value to another currency (or a basket/commodity like gold), intervening to maintain that rate — offering predictability for trade and investment but requiring the government to hold reserves and sometimes sacrifice independent monetary policy. In a floating system, the currency's value is set by market supply and demand, allowing more monetary policy flexibility but exposing the economy to potentially greater exchange-rate volatility."}, {"q": "Explain the role of the IMF and World Bank in the global economy and how conditionality functions in IMF lending.", "a": "The IMF works to maintain international monetary stability, acting as a lender of last resort to countries facing balance-of-payments crises, while the World Bank provides long-term development financing for infrastructure and poverty reduction. IMF loans typically come with conditionality — the borrowing country must agree to implement specified economic policy reforms (such as fiscal austerity or structural changes) as a condition of receiving and continuing to receive funds, intended to restore economic stability but often controversial for its social costs."}, {"q": "Explain the developmental state model and how it differs from both pure free-market liberalism and Marxist central planning.", "a": "The developmental state model involves the government actively guiding and accelerating industrialization and economic transformation — through targeted investment, protection of strategic industries, and coordination with the private sector — while still operating largely within a market-based economy. This differs from pure liberalism, which minimizes state intervention and trusts market forces alone, and from Marxist central planning, which replaces markets with state ownership and control of the means of production; the developmental state instead blends state direction with market mechanisms, as seen in Japan, South Korea, and Taiwan."}, {"q": "Explain the concept of comparative advantage and its role in liberal trade theory.", "a": "Comparative advantage, developed by David Ricardo, holds that even if one country can produce every good more efficiently than another, both countries still gain by specializing in the goods they produce relatively most efficiently (at the lowest opportunity cost) and trading for the rest. This principle underpins liberal IPE's argument that free trade benefits all participating countries by allowing more efficient global allocation of resources."}, {"q": "Explain the structuralist/Marxist critique of the global capitalist economic system.", "a": "Structuralist and Marxist theorists argue that the global capitalist economy is not a neutral, mutually beneficial arena but a structured system in which wealthy 'core' states and capital-owning classes systematically benefit at the expense of poorer 'periphery' states and working classes, through unequal exchange, resource extraction, and dependency relationships that perpetuate global inequality rather than resolve it."}]}, {"id": "ch4", "title": "Chapter 4: Globalization and Regionalism", "mcq": [{"q": "Globalization is generally defined as a process in which:", "o": ["State boundaries become more important", "The importance of state boundaries decreases and people/economies become integrated", "Countries become fully isolated", "Only economic activity is affected"], "a": 1, "e": "Globalization is described as an economic, political, technological and socio-cultural process reducing the significance of state borders."}, {"q": "Which is NOT one of the three main dimensions of globalization discussed?", "o": ["Economic dimension", "Socio-cultural dimension", "Political dimension", "Military dimension"], "a": 3, "e": "The module identifies economic, socio-cultural and political dimensions of globalization, not a separate military dimension."}, {"q": "Global corporations (MNCs) are defined as companies that:", "o": ["Operate only within their home country", "Have headquarters in one country but operations and investments in many others", "Are owned entirely by governments", "Focus solely on non-profit work"], "a": 1, "e": "MNCs are headquartered in one country while operating and investing across many others."}, {"q": "Which perspective on globalization argues that a single global economy has emerged and that states can no longer effectively manage their own economies?", "o": ["Skeptics", "Hyper-globalists", "Transformationalists", "Realists"], "a": 1, "e": "Hyper-globalists claim a runaway single global economy now limits state control over national economic affairs."}, {"q": "The skeptics' view of globalization holds that:", "o": ["There is one unified global economy", "The world is breaking into major regional economic/political blocs rather than one unified economy", "States have completely disappeared", "Globalization began only in the 21st century"], "a": 1, "e": "Skeptics argue the world is fragmenting into regional blocs rather than forming a single integrated economy."}, {"q": "Transformationalists argue that globalization:", "o": ["Ends the relevance of the state entirely", "Produces a new international order in which states adapt but remain significant", "Has no real effect on international relations", "Is purely a cultural phenomenon"], "a": 1, "e": "Transformationalists see states adjusting their roles under new institutions/regulations, while remaining important actors."}, {"q": "International governmental organizations (IGOs) are formed by:", "o": ["Private companies", "Agreements or treaties among national governments", "Individual citizens", "Religious institutions"], "a": 1, "e": "IGOs are established through treaties/agreements between states."}, {"q": "Non-governmental organizations (NGOs) are characterized by being:", "o": ["Government-funded and controlled", "Independent from governments, pursuing social/environmental/development goals", "Military alliances", "Profit-driven corporations"], "a": 1, "e": "NGOs are private, independent-of-government organizations pursuing social, environmental and development activities."}, {"q": "A key criticism from the anti-globalization movement is that globalization:", "o": ["Benefits everyone equally", "Divides the world into rich and poor (North and South)", "Strengthens all national governments equally", "Has no economic impact"], "a": 1, "e": "Anti-globalization critics argue globalization deepens the North-South divide and mainly benefits capital and the wealthy."}, {"q": "A \"region\" in the context of regionalism is defined as:", "o": ["Any single sovereign state", "A limited number of states linked by geography and mutual interdependence", "A global trading bloc with no geographic basis", "An international organization headquarters"], "a": 1, "e": "Nye (1968) defines a region as states linked by geographical proximity and mutual interdependence."}, {"q": "The term 'globalization' became widely used in scholarly and popular discourse mainly from which period onward?", "o": ["The early 1900s", "The late 20th century (1980s-1990s onward)", "The 1600s", "The 1930s"], "a": 1, "e": "Globalization as a widely used concept gained prominence from the late 20th century, especially post-Cold War."}, {"q": "Anthony Giddens described globalization as involving:", "o": ["The intensification of worldwide social relations linking distant localities", "The end of all local cultures", "A purely economic phenomenon only", "The disappearance of technology's role in society"], "a": 0, "e": "Giddens defined globalization as intensifying worldwide social relations that connect distant localities."}, {"q": "Which is generally NOT considered a key driver of contemporary globalization?", "o": ["Advances in transportation and communication technology", "Trade liberalization", "Reduced international travel", "Growth of multinational corporations"], "a": 2, "e": "Reduced international travel runs counter to globalization; the others are recognized drivers of it."}, {"q": "The rapid growth of the internet and digital communication is most closely tied to which dimension of globalization?", "o": ["Economic dimension only", "Technological factors enabling economic and socio-cultural globalization", "Political dimension exclusively", "Military dimension"], "a": 1, "e": "Technological advances, especially in communication, are a key enabler underlying both economic and socio-cultural globalization."}, {"q": "The economic dimension of globalization is marked especially by the growth of:", "o": ["Local subsistence farming", "Global trade, finance, and multinational production networks", "National-only stock markets", "Isolated national currencies"], "a": 1, "e": "Economic globalization involves expanding global trade, financial flows and cross-border corporate production."}, {"q": "The political dimension of globalization involves issues like human rights and security increasingly being addressed:", "o": ["Only at the local municipal level", "At a global rather than purely national level", "Exclusively by individual states acting alone", "Through purely military means"], "a": 1, "e": "Political globalization reflects how governance challenges are increasingly tackled through international cooperation."}, {"q": "The socio-cultural dimension of globalization refers to social relations and cultural practices becoming:", "o": ["More strictly tied to a single territory", "Increasingly delinked from specific territories, producing a sense of 'global culture'", "Completely eliminated", "Irrelevant to international relations"], "a": 1, "e": "Socio-cultural globalization involves culture and social ties stretching beyond specific national/territorial boundaries."}, {"q": "Hyper-globalists tend to view the state's economic role as:", "o": ["Expanding and becoming more powerful", "Declining, as a single global economy limits national government control", "Completely unaffected by globalization", "The dominant force shaping globalization"], "a": 1, "e": "Hyper-globalists argue an integrated global economy undermines individual states' ability to manage their economies."}, {"q": "Skeptics of the globalization thesis argue that current levels of international economic integration are:", "o": ["Historically unprecedented and greater than any past era", "Comparable to, or in some respects less than, earlier historical periods of international trade", "Impossible to measure", "Irrelevant to policy"], "a": 1, "e": "Skeptics contend today's integration isn't as unprecedented as often claimed, pointing to comparable historical trade eras."}, {"q": "Transformationalists, unlike hyper-globalists, argue that globalization:", "o": ["Has no effect on state sovereignty", "Produces a reordering of state power and roles, rather than eliminating states", "Only affects wealthy countries", "Is entirely reversible with no lasting effects"], "a": 1, "e": "Transformationalists see globalization as reshaping (not eliminating) state power and functions."}, {"q": "Multinational corporations (MNCs) contribute to globalization mainly by:", "o": ["Restricting cross-border investment", "Organizing production, investment and trade across many countri
